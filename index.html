<meta charset="utf-8">

<title>Imposter</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#c0392b">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#f4f1ea;--fg:#1d1d1f;--card:#fff;--ac:#c0392b;--mut:#777;--ok:#2e8b57;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17181c;--fg:#eee;--card:#25272d;--mut:#999}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px system-ui,sans-serif;-webkit-user-select:none;user-select:none}
main{max-width:480px;margin:0 auto;padding:16px}
h1{margin:8px 0 16px}
.card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:12px}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:6px 0}
button{font:inherit;border:0;border-radius:12px;padding:12px 16px;background:var(--ac);color:#fff;cursor:pointer}
button.s{background:var(--mut)}
button.big{width:100%;font-size:18px;padding:16px}
.st button{padding:6px 14px;font-size:20px}
input[type=text]{width:100%;font:inherit;padding:10px;border-radius:10px;border:1px solid var(--mut);background:var(--bg);color:var(--fg);margin:3px 0;-webkit-user-select:text;user-select:text}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:6px 12px;border-radius:20px;background:var(--bg);border:1px solid var(--mut);font-size:14px}
.chip.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.pl{display:block;width:100%;margin:6px 0;padding:18px;font-size:20px;touch-action:none}
.pl.done{background:var(--ok)}
.ov{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;z-index:9}
.ov .w{font-size:40px;font-weight:700;margin:12px 0}
.ov .imp{color:var(--ac)}
.timer{font-size:56px;text-align:center;font-variant-numeric:tabular-nums;margin:8px 0}
.who{font-size:44px;font-weight:800;text-align:center;margin:16px 0;word-break:break-word}
.hold{text-align:center;line-height:1.6;height:48vh;display:flex;align-items:center;justify-content:center;border:3px dashed var(--mut);border-radius:18px;margin:12px 0;font-size:22px;color:var(--mut);touch-action:none}
.off{opacity:.4;pointer-events:none}
button.mode.on{background:var(--ok)}
.hidden{display:none}
</style>
</head>

  h += row("own", "Jeder Imposter eigener Hinweis" + (S.blind || !S.hints ? " (erst Hinweis an)" : ""), S.own, S.blind || !S.hints);
  h += `<div class="${S.blind || S.hints ? "" : "off"}"><div class="row" style="margin-top:10px"><span>Nähe der Hinweise${S.blind || S.hints ? "" : " (erst Hinweis an)"}</span></div><div class="chips">` + ["Sehr nah", "Mittel", "Weit"].map((l, k) => `<span class="chip ${S.near === k ? "on" : ""}" data-nr="${k}">${l}</span>`).join("") + '</div></div></div>';
  h += `<div class="card ${tw ? "off" : ""}"><b>Kategorien</b> <span class="chip" id="allc" style="margin-left:8px">Alle an/aus</span><div class="chips" style="margin-top:8px">` + cats.map(c => `<span class="chip ${S.cats.includes(c) ? "on" : ""}" data-c="${c}">${c}</span>`).join("") + '</div></div>';
  h += '<div class="card"><b>Einstellungen</b>' + row("sound", "Töne", S.sound) + '</div>';
  h += '<button class="big" id="go">Spiel starten</button>';
  h += '<button class="big s" id="wl" style="margin-top:10px">Wörter ansehen</button>';
  $("app").innerHTML = h;
  $("app").querySelectorAll("[data-s]").forEach(b => b.onclick = () => {
    const k = b.dataset.s, d = +b.dataset.d, lim = { n: [3, 20], imp: [1, Math.max(1, act().length - 1)], min: [0, 60] }[k];
    S[k] = Math.min(lim[1], Math.max(lim[0], S[k] + d)); save(); setup();
  });
  $("app").querySelectorAll("input[data-i]").forEach(i => i.oninput = () => { S.names[+i.dataset.i] = i.value; save(); });
  $("app").querySelectorAll("[data-m]").forEach(b => b.onclick = () => { S.twist = b.dataset.m === "1"; save(); setup(); });
  const bind = (id, k, again) => { $(id).onchange = e => { S[k] = e.target.checked; save(); if (again) setup(); }; };
  bind("hints", "hints", true); bind("own", "own"); bind("blind", "blind", true); bind("last", "last");
  bind("rnd", "rnd"); bind("score", "score", true);
  $("sound").onchange = e => { S.sound = e.target.checked; save(); if (S.sound) tone([[660, .15, 0]]); };
  if ($("rst")) $("rst").onclick = () => { S.scores = []; save(); alert("Punkte zurückgesetzt."); };
  $("app").querySelectorAll("[data-c]").forEach(c => c.onclick = () => {
    const k = c.dataset.c; S.cats = S.cats.includes(k) ? S.cats.filter(x => x !== k) : S.cats.concat(k);
    save(); c.classList.toggle("on");
  });
  bindOut(setup);
  $("allc").onclick = () => { S.cats = S.cats.length === cats.length ? [] : cats.slice(); save(); setup(); };
  $("app").querySelectorAll("[data-nr]").forEach(c => c.onclick = () => { S.near = +c.dataset.nr; save(); setup(); });
  $("wl").onclick = wordList;
  $("go").onclick = () => { if (!tw && !S.cats.length) { alert("Bitte mindestens eine Kategorie wählen."); return; } start(); };
}
function wordList() {
  const total = cats.reduce((a, c) => a + W[c].flat().length, 0);
  const back = '<button class="s bk" style="width:100%;margin-bottom:12px">Zurück</button>';
  let h = '<h1>Wörter</h1><p>' + cats.length + ' Kategorien, ' + total + ' Wörter, ' + X.length + ' Missverständnis-Paare</p>' + back;
  cats.forEach(c => {
    h += `<div class="card"><b>${esc(c)}</b> (${W[c].flat().length})` + W[c].map(g => `<div style="margin-top:8px;font-size:14px">${g.map(esc).join(", ")}</div>`).join("") + '</div>';
  });
  h += `<div class="card"><b>Missverständnis-Paare</b> (${X.length})` + X.map(p => `<div style="margin-top:6px;font-size:14px">${esc(p[0])} / ${esc(p[1])}</div>`).join("") + '</div>' + back;
  $("app").innerHTML = h;
  $("app").querySelectorAll(".bk").forEach(b => b.onclick = setup);
  window.scrollTo(0, 0);
}
function stepper(k, v, label) {
  return `<div class="row st"><span>${label}</span><span><button class="s" data-s="${k}" data-d="-1">−</button> <b style="display:inline-block;min-width:28px;text-align:center">${v}</b> <button class="s" data-s="${k}" data-d="1">+</button></span></div>`;
}

function start() {
  unlock();
  const seen = x => S.used.includes(x);
  const byFresh = a => shuffle(a).sort((x, y) => seen(x) - seen(y));
  const px = X.filter(p => !p.some(seen));
  const tw = S.twist ? (p => Math.random() < 0.5 ? p : [p[1], p[0]])(shuffle(px.length ? px : X)[0]) : null;
  const cat = tw ? "Missverständnis" : shuffle(S.cats)[0];
  const gf = tw ? [] : W[cat].filter(g => !S.usedG.includes(g[0]));
  const grp = tw ? [] : shuffle(gf.length ? gf : W[cat])[0], word = tw ? tw[0] : byFresh(grp)[0];
  let src = grp;
  if (tw) src = [];
  else if (S.near === 1) src = W[cat].filter(g => g !== grp).flat();
  else if (S.near === 2) { const o = S.cats.filter(c => c !== cat); src = (o.length ? o : [cat]).flatMap(c => W[c].flat()); }
  const pool = byFresh(src.filter(x => x !== word));
  const maxI = Math.max(1, Math.floor(act().length / 2));
  const cnt = S.rnd ? 1 + Math.floor(Math.random() * maxI) : Math.min(S.imp, act().length - 1);
  const ids = shuffle(act()).slice(0, cnt);
  const hint = {};
  ids.forEach((id, k) => { if (S.hints) hint[id] = S.own ? pool[k % pool.length] : pool[0]; });
  if (S.blind || tw) ids.forEach(id => delete hint[id]);
  G = { cat, word, ids, hint, fake: tw ? tw[1] : pool[0], cur: 0, blind: S.blind || !!tw, rnd: S.rnd };
  S.used = [...S.used, word, ...(G.blind ? [G.fake] : []), ...Object.values(hint)].slice(-150);
  if (grp.length) S.usedG = [...S.usedG, grp[0]].slice(-4);
  save();
  reveal();
}
const act = () => [...Array(S.n).keys()].filter(i => !S.out.includes(i));
function outCard() {
  return '<div class="card"><b>Wer spielt mit? (Tippen = raus bzw. wieder rein)</b><div class="chips" style="margin-top:8px">' + [...Array(S.n).keys()].map(i => `<span class="chip ${S.out.includes(i) ? "" : "on"}" data-o="${i}">${esc(nm(i))}</span>`).join("") + '</div></div>';
}
function bindOut(redo) {
  $("app").querySelectorAll("[data-o]").forEach(c => c.onclick = () => {
    const i = +c.dataset.o;
    if (S.out.includes(i)) S.out = S.out.filter(x => x !== i);
    else if (S.n - S.out.length > 3) S.out.push(i);
    else { alert("Mindestens 3 Spieler müssen dabei bleiben."); return; }
    save();
    if (redo) redo(); else c.classList.toggle("on");
  });
}
function intro() {
  const who = nm(shuffle(act())[0]);
  let c = 3;
  $("app").innerHTML = `<div style="min-height:80vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center"><div class="who">${esc(who)}</div><div style="font-size:24px">beginnt. Bereite dich vor.</div><div id="cd" style="font-size:160px;font-weight:800;line-height:1.2;margin-top:24px">3</div></div>`;
  tone([[600, .15, 0]]);
  clearInterval(tick);
  tick = setInterval(() => {
    c--;
    if (c > 0) { $("cd").textContent = c; tone([[600, .15, 0]]); }
    else { clearInterval(tick); tone([[900, .3, 0]]); play(); }
  }, 1000);
}
function reveal() {
  const list = act();
  if (G.cur >= list.length) return intro();
  const i = list[G.cur], last = G.cur === list.length - 1;
  $("app").innerHTML = `<div class="who">${esc(nm(i))}</div><div class="hold" id="hold">Halten zum Ansehen<br>Loslassen zum Verdecken</div><button class="big" id="nx">${last ? "Runde starten" : "Weiter, nächster Spieler"}</button>`;
  const hd = $("hold");
  hd.addEventListener("pointerdown", e => { e.preventDefault(); try { hd.setPointerCapture(e.pointerId); } catch (x) {} showCard(i); });
  ["pointerup", "pointercancel"].forEach(ev => hd.addEventListener(ev, hideCard));
  hd.addEventListener("contextmenu", e => e.preventDefault());
  $("nx").onclick = () => { G.cur++; reveal(); };
}
function showCard(i) {
  const imp = G.ids.includes(i);
  $("ov").innerHTML = `<div>${esc(nm(i))}</div>` + (imp && !G.blind
    ? `<div class="w imp">IMPOSTER</div>` + (S.hints ? `<div class="w">${esc(G.hint[i])}</div>` : "")
    : `<div class="w">${esc(imp ? G.fake : G.word)}</div>`);
  $("ov").classList.remove("hidden"); vib(30);
  $("ov").querySelectorAll(".w").forEach(el => {
    const len = Math.max(...el.textContent.split(" ").map(x => x.length), 1);
    el.style.fontSize = Math.max(20, Math.min(40, Math.floor(window.innerWidth * 0.85 / (len * 0.62)))) + "px";
  });
}
function hideCard() { $("ov").classList.add("hidden"); $("ov").innerHTML = ""; }
const TASKS = ["Nennt reihum ein einzelnes Wort, das euer Wort beschreibt.", "Beschreibt euer Wort reihum in einem Satz.", "Fragt einen Mitspieler, wie er das Wort beschreiben würde.", "Fragt einen Mitspieler, wie er das Wort findet.", "Sagt reihum, was ihr mit dem Wort verbindet.", "Nennt reihum, wo ihr dem Wort schon begegnet seid."];
function play() {
  let left = S.min * 60;
  const draw = () => { const m = String(Math.floor(left / 60)).padStart(2, "0"), s = String(left % 60).padStart(2, "0"); const t = $("t"); if (t) t.textContent = m + ":" + s; };
  $("app").innerHTML = `<h1>Diskussion</h1>` + (S.min ? `<div class="timer" id="t"></div>` : "") + `<div class="card" style="font-size:15px;line-height:1.35">${TASKS.map(x => `<div style="margin:9px 0">• ${esc(x)}</div>`).join("")}</div><button class="big" id="res" style="position:sticky;bottom:12px">Zur Abstimmung</button>`;
  $("res").onclick = vote;
  if (S.min) { draw(); clearInterval(tick); tick = setInterval(() => { left--; draw(); if (left <= 0) { clearInterval(tick); vib([400, 200, 400]); tone([[880, .3, 0], [880, .3, .4], [880, .3, .8], [1175, .6, 1.2]]); $("t").textContent = "Zeit um!"; } }, 1000); }
}
function lastChance(picks) {
  $("app").innerHTML = `<h1>Letzte Chance</h1><p>Der Imposter wurde gefunden. Er darf jetzt laut das geheime Wort raten. War das Wort richtig?</p><button class="big" id="y">Ja, richtig geraten</button><button class="big s" id="n" style="margin-top:10px">Nein, falsch</button>`;
  $("y").onclick = () => result(picks, true);
  $("n").onclick = () => result(picks, false);
}
function vote() {
  clearInterval(tick);
  const need = G.rnd ? act().length - 1 : G.ids.length, sel = new Set();
  const draw = () => {
    let h = `<h1>Abstimmung</h1><p>${G.rnd ? "Wählt alle Verdächtigen aus." : "Wählt " + need + " Spieler aus (" + sel.size + "/" + need + ")."}</p>`;
    for (const i of act()) h += `<button class="pl ${sel.has(i) ? "" : "s"}" data-v="${i}">${esc(nm(i))}${sel.has(i) ? " ✓" : ""}</button>`;
    h += `<button class="big" id="ok" style="margin-top:12px${(G.rnd ? sel.size > 0 : sel.size === need) ? "" : ";opacity:.4"}">Abstimmen</button>`;
    $("app").innerHTML = h;
    $("app").querySelectorAll("[data-v]").forEach(b => b.onclick = () => {
      const i = +b.dataset.v;
      if (sel.has(i)) sel.delete(i); else if (sel.size < need) sel.add(i);
      draw();
    });
    $("ok").onclick = () => { if (G.rnd ? sel.size > 0 : sel.size === need) result([...sel]); };
  };
  draw();
}
function result(picks, guessed) {
  const found = G.ids.filter(i => picks.includes(i)).length;
  const caught = found === G.ids.length && picks.length === G.ids.length;
  if (caught && S.last && guessed === undefined) return lastChance(picks);
  const civWin = caught && guessed !== true;
  tone(civWin ? [[523, .15, 0], [659, .15, .15], [784, .15, .3], [1047, .4, .45]] : [[392, .25, 0], [330, .25, .25], [262, .5, .5]]);
  if (S.score) {
    for (const i of act()) { const imp = G.ids.includes(i); S.scores[i] = (S.scores[i] || 0) + (civWin ? (imp ? 0 : 1) : (imp ? 2 : 0)); }
    save();
  }
  const board = S.score ? '<div class="card"><b>Punktestand</b>' + [...Array(S.n).keys()].map(i => `<div class="row"><span>${esc(nm(i))}</span><b>${S.scores[i] || 0}</b></div>`).join("") + '</div>' : "";
  const verdict = guessed === true
    ? `<div class="card"><b style="color:var(--ac)">Imposter gefunden, aber das Wort richtig geraten. Die Imposter gewinnen.</b></div>`
    : found === G.ids.length
    ? `<div class="card"><b style="color:var(--ok)">Richtig! Alle Imposter gefunden, die Zivilisten gewinnen.</b></div>`
    : found > 0
      ? `<div class="card"><b>Teilweise richtig: ${found} von ${G.ids.length} Imposter gefunden. Die Imposter gewinnen.</b></div>`
      : `<div class="card"><b style="color:var(--ac)">Falsch! Die Imposter gewinnen.</b></div>`;
  clearInterval(tick);
  const h = G.ids.map(i => `<div class="row"><b>${esc(nm(i))}</b><span>${S.hints && G.hint[i] !== undefined ? "Hinweis: " + esc(G.hint[i]) : ""}</span></div>`).join("");
  $("app").innerHTML = `<h1>Auflösung</h1>${verdict}<div class="card"><div>Kategorie: ${esc(G.cat)}</div>${G.blind ? "<div>Wort der Imposter: " + esc(G.fake) + "</div>" : ""}<div class="w" style="font-size:32px;font-weight:700;margin:8px 0">${esc(G.word)}</div></div><div class="card"><b>${G.ids.length > 1 ? "Imposter" : "Imposter war"}</b>${h}</div>${board}${outCard()}<button class="big" id="again">Neue Runde</button><button class="big s" id="back" style="margin-top:10px">Einstellungen</button>`;
  bindOut(); $("again").onclick = start; $("back").onclick = setup;
}
setup();
</script>
<script>
if ("serviceWorker" in navigator) { try { navigator.serviceWorker.register("sw.js"); } catch (e) {} }
</script>
</body>
